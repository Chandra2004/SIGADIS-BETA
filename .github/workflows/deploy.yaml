name: Deploy to InfinityFree (FTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # --- NOTIFIKASI IN-PROGRESS ---
      - name: ⏳ Send In-Progress Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ⏳ *[SIGADIS DEPLOYMENT IN PROGRESS]*
            ------------------------------------------------
            *Target Env*   : InfinityFree & Android APK
            *Branch*       : `${{ github.ref_name }}`
            *Triggered By* : @${{ github.actor }}

            *Status*       : 🧱 Building Assets, APK, & FTP Sync
            *Est. Time*    : ~3 minutes remaining
            ------------------------------------------------
            [📺 Track Live Progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DIPINDAHKAN KE ATAS AGAR GIT MASIH TERSEDIA
      - name: 📝 Extract Info for ChatOps
        id: info
        run: |
          echo "changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | tr '\n' ', ')" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT

      - name: ⏱️ Set Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, filter, hash, libxml, openssl, pcre, pdo, session, tokenizer, xml

      - name: 📦 Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: ⚙️ Prepare Environment
        env:
          PROD_EXTRAS: ${{ secrets.ENV_PROD_EXTRAS }}
        run: |
          echo "$PROD_EXTRAS" >> .env
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite

      - name: 🗂️ Prepare Laravel writable folders
        run: |
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          touch storage/framework/sessions/.gitkeep
          touch storage/framework/cache/.gitkeep
          touch storage/framework/views/.gitkeep
          touch storage/logs/.gitkeep

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies & Build Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: ⚙️ Update capacitor.config.json for Production
        run: |
          jq '.server.url="https://dev-sigadis-beta.rf.gd" | .server.cleartext=false' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json

      - name: 📱 Build APK and publish to public/application
        run: |
          npm run assets:generate
          mkdir -p public/application
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../public/application/SIGADIS.apk
          echo "APK_PATH=$(pwd)/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
          cd ..
          ls -l public/application

      - name: 📦 Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "SIGADIS Android App (Latest Build)"
          draft: false
          prerelease: false
          files: public/application/SIGADIS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Save APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SIGADIS-APK
          path: public/application/SIGADIS.apk
          retention-days: 14

      - name: 🧹 Cleanup
        run: |
          rm -rf node_modules tests .git .github android DUMP logo.png public/application assets

      - name: 🚀 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /dev-sigadis-beta.rf.gd/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/android/**
            **/public/application/**

      - name: ⏱️ Calculate Duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "DURATION_MIN=$((DURATION / 60))m $((DURATION % 60))s" >> $GITHUB_ENV

      # --- NOTIFIKASI SUCCESS (ALL-IN-ONE) ---
      - name: ✅ Send Professional Success Notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 *[SIGADIS DEPLOYMENT SUCCESS]*
            ------------------------------------------------
            *Branch*     : `${{ github.ref_name }}`
            *Author*     : @${{ github.actor }}
            *Duration*   : ${{ env.DURATION_MIN }}
            *Status*     : Web & APK Deployed

            📝 *RELEASE CHANGELOG:*
            `${{ steps.info.outputs.commit_msg }}`

            📂 *File Updated:*
            `${{ steps.info.outputs.changed_files }}`
            ------------------------------------------------
            🌐 *Web App*: [https://dev-sigadis-beta.rf.gd](https://dev-sigadis-beta.rf.gd)
            📱 *Android APK*: [Download SIGADIS.apk](https://github.com/Chandra2004/SIGADIS-BETA/releases/latest/download/SIGADIS.apk)
            ------------------------------------------------
            [📈 View Pipeline Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # --- NOTIFIKASI FAILED ---
      - name: 🚨 Send Professional Failure Notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚨 *[SIGADIS PIPELINE ALERT] - BUILD FAILED*
            ------------------------------------------------
            *Branch*      : `${{ github.ref_name }}`
            *Author*      : @${{ github.actor }}
            *Duration*    : ${{ env.DURATION_MIN }}

            ❌ *Status*: Pipeline process terminated unexpectedly.
            > Periksa log di GitHub untuk melihat detail error (misal gagal di NPM build, APK, atau FTP).

            ------------------------------------------------
            [🔍 View Failure Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})  [🔄 Re-run Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
